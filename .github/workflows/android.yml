name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'

      - name: Install official Godot and Android export templates
        run: |
          download_base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$download_base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "$download_base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$template_dir"

      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.config/godot" builds
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -keystore /tmp/yolkavga-debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Import and check gameplay
        run: |
          godot --headless --editor --path . --import --quit
          godot --headless --path . --script tests/smoke.gd
          xvfb-run -a godot --path . --audio-driver Dummy --script tests/touch.gd

      - name: Export APK and verify signature
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/yolkavga-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --path . --export-debug Android builds/YolKavga-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose builds/YolKavga-debug.apk
          cd builds
          sha256sum YolKavga-debug.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: YolKavga-Android
          path: |
            builds/YolKavga-debug.apk
            builds/SHA256SUMS.txt
          retention-days: 30
